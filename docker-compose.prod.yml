  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     PGPASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_USER: ${POSTGRES_USER:-lab}
  #     POSTGRES_DB: ${POSTGRES_DB:-lab}
  #     TZ: America/Lima
  #   volumes:
  #     - ./scripts/backup:/backup
  #   entrypoint: ['/bin/sh', '-c']
  #   command: |
  #     'while true; do
  #        STAMP=$$(date +%Y%m%d_%H%M%S);
  #        pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB | gzip > /backup/$$STAMP.sql.gz;
  #        find /backup -name "*.sql.gz" -mtime +14 -delete;
  #        sleep 86400;
  #      done'

volumes:
  lab-pgdata-prod:
  lab-storage-prod:
